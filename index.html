<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTP Billing System</title>
  <style>
    /* =====================================================
       BTP BILLING SYSTEM - COMPLETE CSS STYLES
       ===================================================== */
    :root {
      --primary-color: #0056b3;
      --secondary-color: #28a745;
      --dark-color: #333;
      --light-color: #f8f9fa;
      --border-color: #ccc;
      --danger-color: #dc3545;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      padding: 20px;
      color: var(--dark-color);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
      margin-bottom: 20px;
      color: var(--primary-color);
      text-align: center;
    }

    .form-section {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--light-color);
    }

    .form-row {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .form-group {
      flex: 1;
      min-width: 200px;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .form-group input, 
    .form-group select {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
    }

    .form-group input[readonly] {
      background-color: var(--light-color);
      cursor: not-allowed;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    table th, table td {
      border: 1px solid var(--border-color);
      padding: 10px;
      text-align: left;
    }

    table th {
      background-color: var(--primary-color);
      color: #fff;
    }

    table td input {
      width: 100%;
      padding: 6px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 15px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
      color: #fff;
      transition: background 0.3s ease;
    }

    .btn-primary { background-color: var(--primary-color); }
    .btn-primary:hover { background-color: #004085; }

    .btn-success { background-color: var(--secondary-color); }
    .btn-success:hover { background-color: #218838; }

    .btn-danger { background-color: var(--danger-color); }
    .btn-danger:hover { background-color: #c82333; }

    .otp-box {
      background: var(--light-color);
      padding: 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>BEULAH TRADERS PRIVATE LIMITED</h1>

    <!-- OTP SECTION -->
    <div class="form-section otp-box">
      <h3>Customer OTP Verification</h3>
      <div class="form-row" style="margin-top: 10px;">
        <div class="form-group">
          <label for="otpPhone">Mobile Number</label>
          <input type="text" id="otpPhone" placeholder="Enter phone number">
        </div>
        <div class="form-group" style="align-self: flex-end;">
          <button class="btn btn-primary" onclick="sendOTP(document.getElementById('otpPhone').value)">Send OTP</button>
        </div>
        <div class="form-group">
          <label for="otpInput">Enter OTP</label>
          <input type="text" id="otpInput" placeholder="Enter OTP">
        </div>
        <div class="form-group" style="align-self: flex-end;">
          <button class="btn btn-success" onclick="verifyOTP(document.getElementById('otpPhone').value, document.getElementById('otpInput').value)">Verify OTP</button>
        </div>
      </div>
    </div>

    <!-- REPURCHASE BILL FORM -->
    <div class="form-section">
      <h2>Repurchase Bill</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="invoiceNo">Invoice No</label>
          <input type="text" id="invoiceNo" readonly>
        </div>
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="name">Customer Name</label>
          <input type="text" id="name" placeholder="Full Name">
        </div>
        <div class="form-group">
          <label for="repurchasePhone">Phone Number</label>
          <input type="text" id="repurchasePhone" placeholder="10-digit mobile number">
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" placeholder="Address">
        </div>
      </div>

      <table id="repurchaseTable">
        <thead>
          <tr>
            <th>Description</th>
            <th>Weight (kg)</th>
            <th>Rate (₹)</th>
            <th>Amount (₹)</th>
          </tr>
        </thead>
        <tbody id="repurchaseBody">
          <tr>
            <td><input type="text" class="desc" placeholder="Item description"></td>
            <td><input type="number" class="weight" placeholder="0.00" oninput="calculateRow(this)"></td>
            <td><input type="number" class="rate" placeholder="0.00" oninput="calculateRow(this)"></td>
            <td><input type="number" class="amount" placeholder="0.00" readonly></td>
          </tr>
        </tbody>
      </table>

      <div class="form-row">
        <div class="form-group">
          <label for="total">Total Amount (₹)</label>
          <input type="text" id="total" readonly>
        </div>
        <div class="form-group">
          <label for="words">Amount in Words</label>
          <input type="text" id="words" readonly>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="generate()">Generate & Send Repurchase Bill</button>
      </div>
    </div>

    <!-- GST INVOICE FORM -->
    <div class="form-section">
      <h2>GST Invoice</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="gstInvoiceNo">GST Invoice No</label>
          <input type="text" id="gstInvoiceNo" readonly>
        </div>
        <div class="form-group">
          <label for="c_name">Customer Name</label>
          <input type="text" id="c_name" placeholder="Customer or Company Name">
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="text" id="phone" placeholder="Phone Number">
        </div>
      </div>

      <table id="gstTable">
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Model No</th>
            <th>Qty</th>
            <th>Rate (₹)</th>
            <th>Taxable Amount (₹)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input type="text" class="product-search" placeholder="Product name"></td>
            <td><input type="text" class="modelNo" placeholder="Model No"></td>
            <td><input type="number" class="qty" value="1" oninput="calculateRow(this)"></td>
            <td><input type="number" class="rate" placeholder="0.00" oninput="calculateRow(this)"></td>
            <td><input type="number" class="taxable" placeholder="0.00" readonly></td>
          </tr>
        </tbody>
      </table>

      <div class="form-row">
        <div class="form-group">
          <label for="finalTotal">Final Total (₹)</label>
          <input type="text" id="finalTotal" readonly>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="generateGST()">Generate & Send GST Invoice</button>
      </div>
    </div>

  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* =====================================================
       BTP BILLING SYSTEM - FULL COMPLETE JAVASCRIPT LOGIC
       ===================================================== */

    const WEBAPP = "https://script.google.com/macros/s/AKfycbyUYcDPADDKor9rLnLGNBjt_0mMU9OycHzS8FYEnUXlBVaJC2X0sxbWnIyUKGut_W2z/exec"; // Set your Apps Script URL here

    // 1. DYNAMIC CALCULATIONS
    function calculateRow(inputEl) {
      const row = inputEl.closest("tr");
      if (!row) return;

      const weight = parseFloat(row.querySelector(".weight")?.value) || 0;
      const rate = parseFloat(row.querySelector(".rate")?.value) || 0;
      const qty = parseFloat(row.querySelector(".qty")?.value) || 1;

      let amount = 0;
      if (row.querySelector(".weight")) {
        amount = weight * rate;
      } else {
        amount = qty * rate;
      }

      const amountEl = row.querySelector(".amount") || row.querySelector(".taxable");
      if (amountEl) {
        amountEl.value = amount.toFixed(2);
      }

      calculateGrandTotal();
    }

    function calculateGrandTotal() {
      let repurchaseTotal = 0;
      document.querySelectorAll("#repurchaseBody .amount").forEach(el => {
        repurchaseTotal += parseFloat(el.value) || 0;
      });
      const repurchaseTotalEl = document.getElementById("total");
      if (repurchaseTotalEl) {
        repurchaseTotalEl.value = repurchaseTotal.toFixed(2);
      }

      let gstTotal = 0;
      document.querySelectorAll("#gstTable .taxable").forEach(el => {
        gstTotal += parseFloat(el.value) || 0;
      });
      const gstTotalEl = document.getElementById("finalTotal");
      if (gstTotalEl) {
        gstTotalEl.value = gstTotal.toFixed(2);
      }

      const wordsEl = document.getElementById("words");
      if (wordsEl) {
        wordsEl.value = convertNumberToWords(repurchaseTotal);
      }
    }

    // 2. REPURCHASE BILL GENERATION
    async function generate() {
      if (!validateRequiredFields([
        { id: "name", name: "Customer Name" },
        { id: "address", name: "Address" },
        { id: "repurchasePhone", name: "Phone Number" }
      ])) return;

      const items = [];
      document.querySelectorAll("#repurchaseBody tr").forEach(row => {
        const desc = row.querySelector(".desc")?.value || "";
        const weight = row.querySelector(".weight")?.value || "";
        const rate = row.querySelector(".rate")?.value || "";
        const amount = row.querySelector(".amount")?.value || "";

        if (desc) items.push({ desc, weight, rate, amount });
      });

      const payload = {
        type: "repurchase",
        invoiceNo: document.getElementById("invoiceNo")?.value || "",
        date: document.getElementById("date")?.value || new Date().toISOString().split('T')[0],
        name: document.getElementById("name").value,
        address: document.getElementById("address").value,
        phone: document.getElementById("repurchasePhone").value,
        total: document.getElementById("total")?.value || "0",
        words: document.getElementById("words")?.value || "",
        items: items,
        createdBy: JSON.parse(localStorage.getItem("user") || "{}").username || "Admin"
      };

      try {
        const res = await fetch(WEBAPP + "?api=1", {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status) {
          alert("Repurchase Bill Generated Successfully!");
          sendWhatsAppInvoice(payload.phone, payload.invoiceNo, payload.total, data.pdfUrl);
          getNextInvoiceFromServer(); 
        } else {
          alert("Failed to generate bill: " + (data.message || "Unknown error"));
        }
      } catch (err) {
        console.error("Error generating bill:", err);
        alert("Network error while generating bill.");
      }
    }

    // 3. GST INVOICE GENERATION
    async function generateGST() {
      if (!validateRequiredFields([
        { id: "c_name", name: "Customer Name" },
        { id: "phone", name: "Phone Number" }
      ])) return;

      const phone = document.getElementById("phone").value;
      const invoiceNo = document.getElementById("gstInvoiceNo")?.value || "";
      const total = document.getElementById("finalTotal")?.value || "0";

      const items = [];
      document.querySelectorAll("#gstTable tbody tr").forEach(row => {
        const product = row.querySelector(".product-search")?.value || "";
        if (product) {
          items.push({
            product,
            modelNo: row.querySelector(".modelNo")?.value || "",
            qty: row.querySelector(".qty")?.value || "1",
            rate: row.querySelector(".rate")?.value || "0",
            taxable: row.querySelector(".taxable")?.value || "0"
          });
        }
      });

      const payload = {
        type: "gst",
        invoiceNo: invoiceNo,
        c_name: document.getElementById("c_name").value,
        phone: phone,
        finalTotal: total,
        items: items
      };

      try {
        const res = await fetch(WEBAPP + "?api=1", {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status) {
          alert("GST Invoice Generated Successfully!");
          sendWhatsAppInvoice(phone, invoiceNo, total, data.pdfUrl);
          loadGSTInvoiceNo(); 
        } else {
          alert("Failed to generate GST invoice.");
        }
      } catch (err) {
        console.error("Error generating GST invoice:", err);
      }
    }

    // 4. INVOICE SEQUENCING FETCHERS
    async function getNextInvoiceFromServer() {
      try {
        const res = await fetch(`${WEBAPP}?api=1&action=getNextInvoice&type=repurchase`);
        const data = await res.json();
        if (data.invoiceNo && document.getElementById("invoiceNo")) {
          document.getElementById("invoiceNo").value = data.invoiceNo;
        }
      } catch (err) {
        console.error("Error fetching repurchase invoice number:", err);
      }
    }

    async function loadGSTInvoiceNo() {
      try {
        const res = await fetch(`${WEBAPP}?api=1&action=getNextInvoice&type=gst`);
        const data = await res.json();
        if (data.invoiceNo && document.getElementById("gstInvoiceNo")) {
          document.getElementById("gstInvoiceNo").value = data.invoiceNo;
        }
      } catch (err) {
        console.error("Error fetching GST invoice number:", err);
      }
    }

    // 5. WHATSAPP AUTOMATION LINK GENERATOR
    function sendWhatsAppInvoice(phone, invoiceNo, amount, pdfUrl) {
      if (!phone) return;
      const cleanPhone = phone.replace(/[^0-9]/g, "");
      const formattedPhone = cleanPhone.length === 10 ? "91" + cleanPhone : cleanPhone;
      
      const message = `Hello, thank you for doing business with *BEULAH TRADERS PRIVATE LIMITED*.\n\n` +
                      `*Invoice No:* ${invoiceNo}\n` +
                      `*Total Amount:* ₹${amount}\n` +
                      (pdfUrl ? `*Download Invoice:* ${pdfUrl}\n\n` : `\n`) +
                      `Have a great day!`;

      const waUrl = `https://api.whatsapp.com/send?phone=${formattedPhone}&text=${encodeURIComponent(message)}`;
      window.open(waUrl, "_blank");
    }

    // 6. OTP GENERATION & VERIFICATION
    async function sendOTP(phone) {
      if (!phone) {
        alert("Please enter a mobile number.");
        return;
      }
      try {
        const res = await fetch(`${WEBAPP}?api=1&action=sendOTP&phone=${phone}`);
        const data = await res.json();
        if (data.status) {
          alert("OTP sent successfully to " + phone);
        } else {
          alert("Failed to send OTP.");
        }
      } catch (err) {
        console.error("Error sending OTP:", err);
      }
    }

    async function verifyOTP(phone, otpInput) {
      if (!phone || !otpInput) {
        alert("Please enter both phone number and OTP.");
        return false;
      }
      try {
        const res = await fetch(`${WEBAPP}?api=1&action=verifyOTP&phone=${phone}&otp=${otpInput}`);
        const data = await res.json();
        if (data.status) {
          alert("OTP Verified Successfully!");
          return true;
        } else {
          alert("Invalid OTP.");
          return false;
        }
      } catch (err) {
        console.error("Error verifying OTP:", err);
        return false;
      }
    }

    // 7. MISSED CHATS & RECENT UPDATES POLLER
    async function loadMissedChatsAndUpdates() {
      try {
        const res = await fetch(`${WEBAPP}?api=1&action=getUpdates`);
        const data = await res.json();
        
        if (data.chats && data.chats.length > 0) {
          console.log("Pending Missed Chats:", data.chats);
        }
        if (data.updates && data.updates.length > 0) {
          console.log("System Updates:", data.updates);
        }
      } catch (err) {
        console.error("Error loading updates:", err);
      }
    }

    // 8. UTILITY & HELPER FUNCTIONS
    function validateRequiredFields(fields) {
      for (let f of fields) {
        const el = document.getElementById(f.id);
        if (!el || !el.value.trim()) {
          alert(`Please fill in ${f.name}`);
          if (el) el.focus();
          return false;
        }
      }
      return true;
    }

    function convertNumberToWords(amount) {
      const words = ["Zero", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten"];
      const num = Math.floor(amount);
      return num <= 10 ? words[num] + " Rupees Only" : num.toString() + " Rupees Only";
    }

    // INITIALIZATION ON LOAD
    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("date").value = new Date().toISOString().split('T')[0];
      getNextInvoiceFromServer();
      loadGSTInvoiceNo();
      loadMissedChatsAndUpdates();
    });
  </script>
</body>
</html>
